/**
 * Intelligent Real-Time Code Translator
 * Takes arbitrary Arduino C++ code and generates structured STM32 Bare-Metal Register operations.
 */
function translateArduinoToBareMetal(code) {
  if (!code || !code.trim()) {
    return "// Paste or type standard Arduino code on the left to see\n// real-time equivalent Bare-Metal STM32 C registers here!";
  }

  let inits = [];
  let loopBody = [];
  let defines = new Set();
  let helperFuncs = [];

  // Always include standard base headers
  defines.add('#include <stdint.h>');
  defines.add('#include <stdbool.h>');
  defines.add('#define RCC_IOPENR   (*(volatile uint32_t *)(0x40021000UL + 0x34UL))');

  let hasGpioOutput = false;
  let hasGpioInput = false;
  let hasUart = false;
  let hasAdc = false;
  let hasTimer = false;
  let hasDelay = false;

  const lines = code.split('\n');

  lines.forEach(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('//')) return;

    // 1. PinMode OUTPUT
    let m = trimmed.match(/pinMode\s*\(\s*(\d+|\w+)\s*,\s*OUTPUT\s*\)/i);
    if (m) {
      hasGpioOutput = true;
      let pin = isNaN(m[1]) ? "5" : m[1];
      inits.push(`    // Configure Pin ${m[1]} as General Purpose Output`);
      inits.push(`    RCC_IOPENR |= (1UL << 0); // Enable GPIOA clock`);
      inits.push(`    GPIOA_MODER &= ~(3UL << (${pin} * 2));`);
      inits.push(`    GPIOA_MODER |=  (1UL << (${pin} * 2));`);
    }

    // 2. PinMode INPUT_PULLUP
    m = trimmed.match(/pinMode\s*\(\s*(\d+|\w+)\s*,\s*INPUT(?:_PULLUP)?\s*\)/i);
    if (m) {
      hasGpioInput = true;
      let pin = isNaN(m[1]) ? "10" : m[1];
      inits.push(`    // Configure Pin ${m[1]} as Input with Pull-Up`);
      inits.push(`    RCC_IOPENR |= (1UL << 0); // Enable GPIOA clock`);
      inits.push(`    GPIOA_MODER &= ~(3UL << (${pin} * 2));`);
      inits.push(`    GPIOA_PUPDR &= ~(3UL << (${pin} * 2));`);
      inits.push(`    GPIOA_PUPDR |=  (1UL << (${pin} * 2));`);
    }

    // 3. digitalWrite HIGH
    m = trimmed.match(/digitalWrite\s*\(\s*(\d+|\w+)\s*,\s*HIGH\s*\)/i);
    if (m) {
      hasGpioOutput = true;
      let pin = isNaN(m[1]) ? "5" : m[1];
      loopBody.push(`        // Pin ${m[1]} HIGH via atomic Bit Set register`);
      loopBody.push(`        GPIOA_BSRR = (1UL << ${pin});`);
    }

    // 4. digitalWrite LOW
    m = trimmed.match(/digitalWrite\s*\(\s*(\d+|\w+)\s*,\s*LOW\s*\)/i);
    if (m) {
      hasGpioOutput = true;
      let pin = isNaN(m[1]) ? "5" : m[1];
      loopBody.push(`        // Pin ${m[1]} LOW via atomic Bit Reset register`);
      loopBody.push(`        GPIOA_BSRR = (1UL << (${pin} + 16));`);
    }

    // 5. digitalRead
    m = trimmed.match(/digitalRead\s*\(\s*(\d+|\w+)\s*\)/i);
    if (m) {
      hasGpioInput = true;
      let pin = isNaN(m[1]) ? "10" : m[1];
      loopBody.push(`        // Sample Pin ${m[1]} from Input Data Register (IDR)`);
      loopBody.push(`        bool pinState = ((GPIOA_IDR & (1UL << ${pin})) != 0);`);
    }

    // 6. Serial.begin
    m = trimmed.match(/Serial\.begin\s*\(\s*(\d+)\s*\)/i);
    if (m) {
      hasUart = true;
      let baud = m[1];
      inits.push(`    // Initialize USART2 at ${baud} baud`);
      inits.push(`    USART2_BRR = 48000000UL / ${baud}UL;`);
      inits.push(`    USART2_CR1 |= (1UL << 3) | (1UL << 0); // TE + UE`);
    }

    // 7. Serial.print / println
    m = trimmed.match(/Serial\.print(?:ln)?\s*\(\s*(.*?)\s*\)/i);
    if (m) {
      hasUart = true;
      let arg = m[1];
      loopBody.push(`        // Transmit string over USART2`);
      loopBody.push(`        usart2_print(${arg});`);
    }

    // 8. analogRead
    m = trimmed.match(/analogRead\s*\(\s*(\w+)\s*\)/i);
    if (m) {
      hasAdc = true;
      loopBody.push(`        // Trigger ADC1 conversion and wait for End-Of-Conversion (EOC)`);
      loopBody.push(`        ADC1_CR |= (1UL << 2);`);
      loopBody.push(`        while (!(ADC1_ISR & (1UL << 2)));`);
      loopBody.push(`        uint16_t adc_val = (uint16_t)ADC1_DR;`);
    }

    // 9. analogWrite / PWM
    m = trimmed.match(/analogWrite\s*\(\s*(\w+)\s*,\s*(\d+|\w+)\s*\)/i);
    if (m) {
      hasTimer = true;
      loopBody.push(`        // Update Timer Compare Register (Duty Cycle)`);
      loopBody.push(`        TIM1_CCR1 = ${m[2]};`);
    }

    // 10. delay
    m = trimmed.match(/delay\s*\(\s*(\d+|\w+)\s*\)/i);
    if (m) {
      hasDelay = true;
      let ms = m[1];
      loopBody.push(`        delay_ms(${ms});`);
    }
  });

  if (hasGpioOutput || hasGpioInput) {
    defines.add('#define GPIOA_MODER  (*(volatile uint32_t *)(0x50000000UL + 0x00UL))');
    defines.add('#define GPIOA_PUPDR  (*(volatile uint32_t *)(0x50000000UL + 0x0CUL))');
    defines.add('#define GPIOA_IDR    (*(volatile uint32_t *)(0x50000000UL + 0x10UL))');
    defines.add('#define GPIOA_BSRR   (*(volatile uint32_t *)(0x50000000UL + 0x18UL))');
  }

  if (hasUart) {
    defines.add('#define USART2_BASE  (0x40004400UL)');
    defines.add('#define USART2_CR1   (*(volatile uint32_t *)(USART2_BASE + 0x00UL))');
    defines.add('#define USART2_BRR   (*(volatile uint32_t *)(USART2_BASE + 0x0CUL))');
    defines.add('#define USART2_ISR   (*(volatile uint32_t *)(USART2_BASE + 0x1CUL))');
    defines.add('#define USART2_TDR   (*(volatile uint32_t *)(USART2_BASE + 0x28UL))');

    helperFuncs.push(`void usart2_print(const char *s) {
    while (*s) {
        while (!(USART2_ISR & (1UL << 7))); // Wait for TXE
        USART2_TDR = (uint8_t)*s++;
    }
}`);
  }

  if (hasAdc) {
    defines.add('#define ADC1_BASE    (0x40012400UL)');
    defines.add('#define ADC1_ISR     (*(volatile uint32_t *)(ADC1_BASE + 0x00UL))');
    defines.add('#define ADC1_CR      (*(volatile uint32_t *)(ADC1_BASE + 0x08UL))');
    defines.add('#define ADC1_DR      (*(volatile uint32_t *)(ADC1_BASE + 0x40UL))');
  }

  if (hasTimer) {
    defines.add('#define TIM1_BASE    (0x40012C00UL)');
    defines.add('#define TIM1_CR1     (*(volatile uint32_t *)(TIM1_BASE + 0x00UL))');
    defines.add('#define TIM1_CCR1    (*(volatile uint32_t *)(TIM1_BASE + 0x34UL))');
  }

  if (hasDelay) {
    helperFuncs.push(`void delay_ms(volatile uint32_t ms) {
    while (ms--) {
        for (volatile uint32_t i = 0; i < 4800; i++) { __asm volatile("nop"); }
    }
}`);
  }

  let result = [];
  result.push("// ============================================================================");
  result.push("// Equivalent Bare-Metal Embedded C (Direct STM32 Nucleo-C031C6 Registers)");
  result.push("// Generated in real-time from your Arduino code");
  result.push("// ============================================================================");
  result.push(Array.from(defines).join('\n'));
  result.push("");

  if (helperFuncs.length > 0) {
    result.push(helperFuncs.join('\n\n'));
    result.push("");
  }

  result.push("int main(void) {");
  if (inits.length > 0) {
    result.push("    // --- Peripherals & Pin Initialization ---");
    result.push(inits.join('\n'));
    result.push("");
  }

  result.push("    // --- Superloop Execution ---");
  result.push("    while (1) {");
  if (loopBody.length > 0) {
    result.push(loopBody.join('\n'));
  } else {
    result.push("        // Active runtime processing");
  }
  result.push("    }");
  result.push("}");

  return result.join('\n');
}

function initCodeComparator(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const select = container.querySelector('.preset-select');
  const input = container.querySelector('.code-input');
  const output = container.querySelector('.code-output code');

  if (!select || !input || !output) return;

  function loadPreset() {
    const val = select.value;
    if (PRESETS[val]) {
      input.value = PRESETS[val].arduino;
      output.textContent = PRESETS[val].baremetal;
    }
  }

  function handleLiveInput() {
    output.textContent = translateArduinoToBareMetal(input.value);
  }

  select.addEventListener('change', loadPreset);
  input.addEventListener('input', handleLiveInput);
  loadPreset();
}

function runInteractiveTranslation(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const input = container.querySelector('.code-input');
  const output = container.querySelector('.code-output code');
  if (input && output) {
    output.textContent = translateArduinoToBareMetal(input.value);
  }
}

function setupAllComparators() {
  document.querySelectorAll('.code-comparator-widget').forEach((el, idx) => {
    if (!el.id) el.id = 'comparator-' + idx;
    initCodeComparator(el.id);
  });
}

// Ensure execution whether DOM is loading or already ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', setupAllComparators);
} else {
  setupAllComparators();
}
</script>
